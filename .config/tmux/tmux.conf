#  DETAULT SETTINGS
# --------------------
# Set the default shell to your user's shell
set-option -g default-shell $SHELL

# Enable true color support for a better color experience
# set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g allow-passthrough on

# Enable mouse mode to allow clicking and scrolling
set -g mouse on

# Improve responsiveness by enabling focus events
set -g focus-events on

# Reduce escape time for faster responsiveness in programs like Neovim
set -sg escape-time 10

# Allow passthrough for terminals like Yazi to handle their own rendering
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Make window panes transparent
set-option -g window-style 'bg=default'
set-option -g window-active-style 'bg=default'

# Make the status bar transparent
set-option -g status-style bg=default

# Turn Off extended Keys
set -g extended-keys on
set -g extended-keys-format csi-u

# PREFIX
# --------------------
# Unbind the default C-b and set the prefix to C-Space for easier access
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# NUMBERING
# --------------------
# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# KEYBINDINGS
# --------------------
# Window navigation
bind -n M-H previous-window
bind -n M-L next-window

# Pane creation (replaces your old bindings with more intuitive ones)
unbind %
bind | split-window -h -c '#{pane_current_path}' # Split vertically
unbind '"'
bind - split-window -v -c '#{pane_current_path}' # Split horizontally

# Reload config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# Pane resizing with repeat-time for faster adjustments
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z # Maximize/un-maximize current pane

# Vi-mode for copy mode
set-window-option -g mode-keys vi

# Keybindings for copy mode (combining both configs)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane # Prevents mouse from exiting copy mode


# THEME AND STATUS BAR
# --------------------
# Set the status bar to the top of the screen
set-option -g status-position top

# Basic status bar styling
# set -g status-bg "#24292f"
set -g status-fg "#adbac7"
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 50

# Left side with session-name
set -g status-left '#[fg=#ffdf5d]  #{=50:session_name}'

# Message/command prompt styling
set -g message-style fg="#adbac7",bg="#24292f"

# Status bar content
# set -g status-right '#[fg=green]CPU:#{cpu} | #[fg=yellow]MEM:#{mem}'
set -g status-right '#[fg=#adbac7]%H:%M %d-%b-%y'

# Window status format (inactive windows)
set -g window-status-format '#[fg=#c9d1d9] #W '

# Current window status format (active window)
set -g window-status-current-format '#[fg=#58a6ff] 󰻃 #W '

# Pane border styling
set -g pane-border-style fg="#313641"
set -g pane-active-border-style fg="#58a6ff"


# TMUX PLUGINS (TPM)
# --------------------
# List of plugins to be managed by TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # Sensible default settings
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless navigation between Vim and Tmux panes
set -g @plugin 'tmux-plugins/tmux-yank' # For copying to system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect' # Persist sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum' # Automatically save sessions
# set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and MEM widgets for status bar

# Configuration for tmux-resurrect and tmux-continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Your custom resurrect keybindings
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Initialize TMUX plugin manager (this MUST be the last line in your config)
run '~/.tmux/plugins/tpm/tpm'
